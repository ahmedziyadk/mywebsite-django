<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
         margin:auto;
         margin-bottom: 0%;
        }


        .nav{
            background-color: black;
            display: flex;
            align-items: center;
            margin-top: 0%;
            
        }

        .nav a:hover{
            color: yellow;
        }

        .nav h2{
            color: white;
            margin-left: 20px;
        }

        .links{
            display: flex;
            margin: auto;
            gap: 80px;
        }

        .links a{
            text-decoration: none;
            color: white;
        }
        
        .logout{
            background-color: rgb(108, 108, 0);
            color: white;
            padding: 10px;
            padding-left: 20px;
            padding-right: 20px;
            margin-right: 40px;
            border-radius: 20px;
            border: none;
        }

        
   

        body{
            text-align: center;
        }
        
        .frm{
            width:400px;
            margin: auto;
            padding: 40px;
            margin-top: 40px;
            border-radius: 5%;
            margin-bottom:40px ;
            box-shadow: 1px 1px 6px rgba(0, 0, 0, 0.26);
        }
        

        label{
            display: block;
            text-align: justify;
        }

        .btn{
         background-color: black;
         color: white;
         width: 45%;
         height:40px;
         border-radius: 5%;
         border:none;
         margin-top: 10px;
        }

        textarea{
         width: 100%;
         height: 70px;
         
        }

        input{
            width: 100%;
            height: 25px;
            margin-bottom: 20px;
            
            
        }




        .details{
            display: flex;
            justify-content: center;
        }

        .details img{
            width: 50px;
            height: 50px;
        }

        .details div{
            box-shadow: 1px 1px 6px rgba(0, 0, 0, 0.356);
            
            width: 250px;
            height: 170px;
            padding: 20px;
            margin-bottom: 100px;
            border-radius: 5%;
            margin-left: 20px;

        }


        


        
        
        
        



        


        
    </style>
</head>
<body>
    <div class="nav">
        <h2>My Website</h2>
        <div class="links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
        </div>

        <button class="logout">Logout</button>

    </div>

    <h1>Contact us</h1>
    <p>Have questions? We'd love to hear from you.</p>

<div class="frm">
    <h2>Send Message</h2>

    <form class="forms">
        <label>Your Name</label>
        <input type="text" placeholder="">
        
        <label>Email</label>
        <input type="text" placeholder="">
        
        <label>Phone Number</label>
        <input type="number" placeholder="">
        
        <label>Message</label>
        <textarea></textarea>
        
        <input class="btn" type="submit" value="Send Message">
    </form>
</div>



<div class="details">
    <div>
        <img src="https://cdn-icons-png.flaticon.com/128/684/684908.png">
        <h3>Address</h3>
        <h5>Kochi,Kerala</h5>
    </div>

    <div>
        <img src="https://cdn-icons-png.flaticon.com/128/732/732200.png" alt="">
        <h3>Email</h3>
        <h5>mywebsite@gmail.com</h5>
    </div>

    <div>
        <img src="https://cdn-icons-png.flaticon.com/128/9946/9946341.png" alt="">
        <h3>Phone</h3>
        <h5>+917034325180</h5>
    </div>
</div>

</body>
</html>
